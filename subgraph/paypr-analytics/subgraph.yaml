specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PayPR
    network: arbitrum-sepolia
    source:
      address: "0x1afd0Ec4340845c8E317F7B56489d08A48bAB2E4"
      abi: PayPR
      startBlock: 198660252
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BountyPaid
        - DeveloperRegistered
        - FundsDeposited
        - RepositoryRegistered
      abis:
        - name: PayPR
          file: ./abis/PayPR.json
      eventHandlers:
        - event: BountyPaid(indexed string,indexed string,indexed uint256,uint256)
          handler: handleBountyPaid
        - event: DeveloperRegistered(indexed string,indexed address)
          handler: handleDeveloperRegistered
        - event: FundsDeposited(indexed string,uint256)
          handler: handleFundsDeposited
        - event: RepositoryRegistered(indexed string,indexed address,uint256)
          handler: handleRepositoryRegistered
      file: ./src/pay-pr.ts
